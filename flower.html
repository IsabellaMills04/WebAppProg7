	<script>
		let ids = [
			"image0", "image1", "image2", "image3", "image4", "image5", "image6", "image7", "image8", "image9", "image10",
			"image11", "image12", "image13", "image14", "image15", "image16", "image17", "image18", "image19", "image20", 
			"image21", "image22", "image23", "image24", "image25", "image26", "image27", "image28", "image29", "image30", 
			"image31", "image32", "image33", "image34", "image35"
		];
		let score = 0;
		let locationsVisited = 0;
		let lastLocation = 0;

		let poisonLocation = 19;
		let roseLocation = 14;
		let lilyLocations = [3, 25];
		let daisyLocations = [2, 5, 11, 20, 21];

		let gameOver = false;

		function check(position){
			if (gameOver) {
				return;
			}

			let id = ids[position];
			let image = document.getElementById(id);

			locationsVisited += 1;
			
			let newImage = null;

			if (position == poisonLocation) {
				newImage = "poisonIvy.jpg";
				score -= 4;
				gameOver = true;
			}
			else if (position == roseLocation) {
				newImage = "rose.jpg";
				score += 4;
			}
			else if (lilyLocations.includes(position)) {
				newImage = "lily.jpg";
				score += 2;
			}
			else if (daisyLocations.includes(position)) {
				newImage = "daisy.jpg";
				score += 1;
			}

			if (newImage != null) {
				image.src = newImage;
				image.onclick = null;
			}
			

			document.getElementById("locations").innerHTML = "Number of locations checked is " + locationsVisited + "."
			document.getElementById("score").innerHTML = "Score is " + score + "."

			lastLocation = position;
		}

		function help() {
			let row = Math.floor(lastLocation / 6);
			let col = lastLocation % 6;
			let result = "warm";
		
			let nearby = [
				row * 6 + (col + 1) % 6,
				row * 6 + (col + 5) % 6,
				((row + 1) % 6) * 6 + col,
				((row + 5) % 6) * 6 + col
			];

			let around = [];
			for (let r = row - 1; r <= row + 1; r++) {
				for (let c = col - 1; c <= col + 1; c++) {
					if (r >= 0 && r < 6 && c >= 0 && c < 6) {
						around.push(r * 6 + c);
					}
				}
			}

			let cold = false
			for (let i = 0; i < nearby.length; i++) {
				if (daisyLocations.includes(nearby[i])) {
					cold = true;
				}
			}
			if (cold) {
        		result = "cold";
			}

			else if (around.includes(roseLocation)) {
				result = "hot";
			}

			else if (around.includes(poisonLocation)) {
				result = "watch out";
			}

			document.getElementById("help").innerHTML = result;
		}
	</script>
